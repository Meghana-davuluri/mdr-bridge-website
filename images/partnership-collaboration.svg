<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad4)"/>

  <!-- Handshake illustration -->
  <g transform="translate(200, 150)">
    <!-- Left hand/arm -->
    <rect x="20" y="80" width="80" height="40" rx="5" fill="#000d3d"/>
    <path d="M 100 85 L 120 70 L 130 75 L 135 85 L 130 95 L 120 100 L 100 110 Z" fill="#000d3d"/>

    <!-- Right hand/arm -->
    <rect x="130" y="80" width="80" height="40" rx="5" fill="#00aab7"/>
    <path d="M 130 85 L 110 70 L 100 75 L 95 85 L 100 95 L 110 100 L 130 110 Z" fill="#00aab7"/>

    <!-- Connection point -->
    <circle cx="115" cy="85" r="10" fill="white" opacity="0.5"/>
  </g>

  <!-- Network/connection nodes -->
  <g opacity="0.6">
    <!-- Node 1 -->
    <circle cx="100" cy="100" r="20" fill="none" stroke="#00aab7" stroke-width="3"/>
    <circle cx="100" cy="100" r="8" fill="#00aab7"/>

    <!-- Node 2 -->
    <circle cx="500" cy="100" r="20" fill="none" stroke="#000d3d" stroke-width="3"/>
    <circle cx="500" cy="100" r="8" fill="#000d3d"/>

    <!-- Node 3 -->
    <circle cx="100" cy="320" r="20" fill="none" stroke="#000d3d" stroke-width="3"/>
    <circle cx="100" cy="320" r="8" fill="#000d3d"/>

    <!-- Node 4 -->
    <circle cx="500" cy="320" r="20" fill="none" stroke="#00aab7" stroke-width="3"/>
    <circle cx="500" cy="320" r="8" fill="#00aab7"/>

    <!-- Connecting lines -->
    <line x1="115" y1="110" x2="285" y2="180" stroke="#00aab7" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="485" y1="110" x2="315" y2="180" stroke="#000d3d" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="115" y1="310" x2="285" y2="240" stroke="#000d3d" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="485" y1="310" x2="315" y2="240" stroke="#00aab7" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <!-- Success/growth arrow -->
  <g transform="translate(450, 250)" opacity="0.7">
    <path d="M 10 40 L 10 10 L 40 10" fill="none" stroke="#00aab7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="25,10 40,10 40,25" fill="none" stroke="#00aab7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="40" r="4" fill="#00aab7"/>
    <circle cx="20" cy="25" r="4" fill="#00aab7"/>
    <circle cx="30" cy="17" r="4" fill="#00aab7"/>
  </g>
</svg>
