<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="deviceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000d3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00aab7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>

  <!-- Medical Device Illustration -->
  <g transform="translate(150, 80)">
    <!-- Device body -->
    <rect x="50" y="80" width="200" height="180" rx="20" fill="url(#deviceGrad)" opacity="0.9"/>
    <rect x="60" y="90" width="180" height="40" rx="5" fill="white" opacity="0.3"/>

    <!-- Screen -->
    <rect x="70" y="140" width="160" height="100" rx="10" fill="#e0f2fe"/>
    <line x1="90" y1="160" x2="210" y2="160" stroke="#00aab7" stroke-width="3"/>
    <line x1="90" y1="180" x2="190" y2="180" stroke="#00aab7" stroke-width="3"/>
    <line x1="90" y1="200" x2="200" y2="200" stroke="#00aab7" stroke-width="3"/>
    <circle cx="90" cy="220" r="8" fill="#00aab7"/>
    <circle cx="110" cy="220" r="8" fill="#000d3d"/>
    <circle cx="130" cy="220" r="8" fill="#00aab7"/>
  </g>

  <!-- Innovation symbols -->
  <g opacity="0.6">
    <!-- Lightbulb -->
    <circle cx="480" cy="100" r="25" fill="none" stroke="#00aab7" stroke-width="3"/>
    <path d="M 480 80 L 480 65 M 460 100 L 445 100 M 500 100 L 515 100 M 465 85 L 455 75 M 495 85 L 505 75" stroke="#00aab7" stroke-width="2"/>

    <!-- Gear -->
    <circle cx="100" cy="320" r="30" fill="none" stroke="#000d3d" stroke-width="3"/>
    <circle cx="100" cy="320" r="15" fill="none" stroke="#000d3d" stroke-width="2"/>
    <rect x="95" y="285" width="10" height="15" fill="#000d3d"/>
    <rect x="95" y="340" width="10" height="15" fill="#000d3d"/>
    <rect x="115" y="315" width="15" height="10" fill="#000d3d"/>
    <rect x="70" y="315" width="15" height="10" fill="#000d3d"/>
  </g>

  <!-- Connecting lines -->
  <g opacity="0.3">
    <line x1="200" y1="200" x2="460" y2="100" stroke="#00aab7" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="250" y1="240" x2="130" y2="320" stroke="#000d3d" stroke-width="2" stroke-dasharray="5,5"/>
  </g>
</svg>
