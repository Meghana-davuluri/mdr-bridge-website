<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad3)"/>

  <!-- Document/Checklist representation -->
  <g transform="translate(150, 50)">
    <!-- Main document -->
    <rect x="50" y="50" width="200" height="280" rx="10" fill="white" stroke="#000d3d" stroke-width="3"/>

    <!-- Document header -->
    <rect x="50" y="50" width="200" height="60" rx="10" fill="#000d3d"/>
    <text x="150" y="85" text-anchor="middle" fill="white" font-size="18" font-weight="bold">FDA / ISO</text>

    <!-- Checkboxes with checkmarks -->
    <g stroke="#00aab7" stroke-width="3" fill="none">
      <!-- Check 1 -->
      <rect x="70" y="140" width="25" height="25" rx="3" fill="#e0f2fe"/>
      <polyline points="75,152 82,159 93,145" stroke="#00aab7" stroke-width="3" fill="none"/>
      <line x1="105" y1="152" x2="220" y2="152" stroke="#000d3d" stroke-width="2"/>

      <!-- Check 2 -->
      <rect x="70" y="185" width="25" height="25" rx="3" fill="#e0f2fe"/>
      <polyline points="75,197 82,204 93,190" stroke="#00aab7" stroke-width="3" fill="none"/>
      <line x1="105" y1="197" x2="220" y2="197" stroke="#000d3d" stroke-width="2"/>

      <!-- Check 3 -->
      <rect x="70" y="230" width="25" height="25" rx="3" fill="#e0f2fe"/>
      <polyline points="75,242 82,249 93,235" stroke="#00aab7" stroke-width="3" fill="none"/>
      <line x1="105" y1="242" x2="200" y2="242" stroke="#000d3d" stroke-width="2"/>

      <!-- Check 4 -->
      <rect x="70" y="275" width="25" height="25" rx="3" fill="#e0f2fe"/>
      <polyline points="75,287 82,294 93,280" stroke="#00aab7" stroke-width="3" fill="none"/>
      <line x1="105" y1="287" x2="210" y2="287" stroke="#000d3d" stroke-width="2"/>
    </g>
  </g>

  <!-- Shield icon representing compliance/security -->
  <g transform="translate(420, 120)">
    <path d="M 60 20 L 60 20 Q 60 15 55 15 L 25 15 Q 20 15 20 20 L 20 50 Q 20 80 40 95 Q 60 80 60 50 Z" fill="#00aab7" opacity="0.8"/>
    <polyline points="30,50 37,57 52,38" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Quality badge -->
  <g transform="translate(50, 250)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="#000d3d" stroke-width="3"/>
    <circle cx="50" cy="50" r="30" fill="none" stroke="#00aab7" stroke-width="2"/>
    <text x="50" y="50" text-anchor="middle" fill="#000d3d" font-size="14" font-weight="bold" dy="5">QMS</text>
  </g>
</svg>
