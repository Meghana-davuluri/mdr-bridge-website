<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad2)"/>

  <!-- People icons -->
  <g transform="translate(150, 120)">
    <!-- Person 1 -->
    <circle cx="50" cy="50" r="25" fill="#000d3d"/>
    <path d="M 25 90 Q 50 75 75 90 L 75 120 L 25 120 Z" fill="#000d3d"/>

    <!-- Person 2 -->
    <circle cx="150" cy="50" r="25" fill="#00aab7"/>
    <path d="M 125 90 Q 150 75 175 90 L 175 120 L 125 120 Z" fill="#00aab7"/>

    <!-- Person 3 -->
    <circle cx="250" cy="50" r="25" fill="#000d3d"/>
    <path d="M 225 90 Q 250 75 275 90 L 275 120 L 225 120 Z" fill="#000d3d"/>
  </g>

  <!-- Connecting lines showing collaboration -->
  <g stroke="#00aab7" stroke-width="3" opacity="0.6">
    <line x1="200" y1="190" x2="300" y2="190"/>
    <line x1="300" y1="190" x2="400" y2="190"/>
    <line x1="250" y1="170" x2="350" y2="210"/>
  </g>

  <!-- Icons representing expertise -->
  <g opacity="0.7">
    <!-- Document -->
    <rect x="80" y="280" width="60" height="80" rx="5" fill="#000d3d"/>
    <line x1="95" y1="300" x2="125" y2="300" stroke="white" stroke-width="2"/>
    <line x1="95" y1="320" x2="125" y2="320" stroke="white" stroke-width="2"/>
    <line x1="95" y1="340" x2="115" y2="340" stroke="white" stroke-width="2"/>

    <!-- Graph -->
    <rect x="270" y="280" width="60" height="80" rx="5" fill="#00aab7"/>
    <polyline points="285,340 295,320 305,330 315,310" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="285" cy="340" r="3" fill="white"/>
    <circle cx="295" cy="320" r="3" fill="white"/>
    <circle cx="305" cy="330" r="3" fill="white"/>
    <circle cx="315" cy="310" r="3" fill="white"/>

    <!-- Checkmark -->
    <circle cx="490" y="320" r="40" fill="#000d3d"/>
    <polyline points="470,320 485,335 510,305" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
